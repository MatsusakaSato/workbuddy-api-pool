<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy 网关</title>
<script>window.__DSH_GATEWAY_KEY__ = "__GATEWAY_KEY__";</script>
<script>
/* 预绘制主题，避免刷新时闪白；?theme=dark|light 可直接深链 */
try{
  var q=new URLSearchParams(location.search).get('theme');
  if(q==='dark'||q==='light') localStorage.setItem('wbgw_theme',q);
  if(localStorage.getItem('wbgw_theme')==='dark')
    document.documentElement.classList.add('sl-theme-dark');
}catch(e){}
</script>
<link rel="stylesheet" href="/static/vendor/shoelace/themes/light.css">
<link rel="stylesheet" href="/static/vendor/shoelace/themes/dark.css">
<script type="module">
  import { setBasePath } from '/static/vendor/shoelace/shoelace.js';
  setBasePath('/static/vendor/shoelace');
</script>
<style>
/* 设计系统来自内嵌的 Shoelace（themes/light.css + dark.css）。
   这里只写 Shoelace 没有的东西：密集表格与面板布局，取值一律走它的 token，
   保证自定义部分和组件库同一套颜色/间距/圆角。 */
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sl-font-sans);
  font-size:var(--sl-font-size-small);
  line-height:1.5;
  background:var(--sl-color-neutral-50);
  color:var(--sl-color-neutral-900);
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--sl-font-mono)}
.muted{color:var(--sl-color-neutral-500)}
.xs{font-size:var(--sl-font-size-x-small)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:var(--sl-spacing-x-large);text-align:center;color:var(--sl-color-neutral-500)}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:var(--sl-spacing-x-small);
  padding:var(--sl-spacing-x-small) var(--sl-spacing-medium);
  background:var(--sl-color-neutral-0);
  border-bottom:1px solid var(--sl-color-neutral-200);
}
.brand{display:flex;align-items:baseline;gap:6px;font-weight:var(--sl-font-weight-semibold)}
.brand .v{font-size:var(--sl-font-size-x-small);font-weight:400;color:var(--sl-color-neutral-500)}
.live{font-size:var(--sl-font-size-x-small);color:var(--sl-color-neutral-500)}
.spacer{flex:1}
#msg{font-size:var(--sl-font-size-x-small);color:var(--sl-color-neutral-600)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sl-color-neutral-400);flex:none}
.dot.on{background:var(--sl-color-success-600)}
.dot.off{background:var(--sl-color-danger-600)}

/* ---------- 布局 ---------- */
main{max-width:1680px;margin:0 auto;padding:var(--sl-spacing-medium)}
.panel{
  background:var(--sl-color-neutral-0);
  border:1px solid var(--sl-color-neutral-200);
  border-radius:var(--sl-border-radius-large);
  overflow:hidden;margin-bottom:var(--sl-spacing-medium);
}
.ph{
  display:flex;align-items:center;gap:var(--sl-spacing-small);
  padding:var(--sl-spacing-x-small) var(--sl-spacing-medium);
  border-bottom:1px solid var(--sl-color-neutral-200);
  font-weight:var(--sl-font-weight-semibold);
}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:var(--sl-spacing-x-small);
        font-weight:400}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--sl-spacing-medium);align-items:start}
@media(max-width:1180px){.cols{grid-template-columns:1fr}}
.cols .panel{margin-bottom:0}

/* 指标条：单行，不要把 6 个指标做成 6 张大卡片 */
.strip{
  display:flex;flex-wrap:wrap;gap:var(--sl-spacing-large);
  padding:var(--sl-spacing-small) var(--sl-spacing-medium);
  background:var(--sl-color-neutral-0);
  border:1px solid var(--sl-color-neutral-200);
  border-radius:var(--sl-border-radius-large);
  margin-bottom:var(--sl-spacing-medium);
}
.si{display:flex;flex-direction:column;min-width:44px}
.si i{font-style:normal;font-size:var(--sl-font-size-x-small);color:var(--sl-color-neutral-500)}
.si b{font-size:var(--sl-font-size-medium);font-weight:var(--sl-font-weight-semibold);
      font-variant-numeric:tabular-nums;line-height:1.3}

/* ---------- 表格：句子式表头（不用全大写，那是表格软件的味道）---------- */
table{width:100%;border-collapse:collapse;font-size:var(--sl-font-size-x-small)}
th{
  text-align:left;font-weight:var(--sl-font-weight-semibold);
  color:var(--sl-color-neutral-600);white-space:nowrap;
  padding:var(--sl-spacing-x-small) var(--sl-spacing-medium);
  border-bottom:1px solid var(--sl-color-neutral-200);
}
td{
  padding:var(--sl-spacing-x-small) var(--sl-spacing-medium);
  border-bottom:1px solid var(--sl-color-neutral-100);
  vertical-align:top;
}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
.copy{cursor:pointer}
.copy:hover{color:var(--sl-color-primary-600);text-decoration:underline}

/* ---------- 模型：家族分组（多列卡片流）+ 分面 + 排序 ---------- */
.fbar{display:flex;flex-wrap:wrap;gap:var(--sl-spacing-2x-small);align-items:center;
      padding:var(--sl-spacing-x-small) var(--sl-spacing-medium);
      border-bottom:1px solid var(--sl-color-neutral-200)}
.mgroups{column-width:430px;column-gap:var(--sl-spacing-medium);padding:var(--sl-spacing-medium)}
.mgroup{break-inside:avoid;-webkit-column-break-inside:avoid;overflow:hidden;
        border:1px solid var(--sl-color-neutral-200);
        border-radius:var(--sl-border-radius-medium);
        margin:0 0 var(--sl-spacing-small)}
.mgh{display:flex;align-items:center;gap:6px;
     padding:3px var(--sl-spacing-small);
     background:var(--sl-color-neutral-50);
     border-bottom:1px solid var(--sl-color-neutral-200);
     font-size:var(--sl-font-size-x-small);font-weight:var(--sl-font-weight-semibold);
     color:var(--sl-color-neutral-600)}
.mgh .n{margin-left:auto;font-weight:400;color:var(--sl-color-neutral-500);
        font-variant-numeric:tabular-nums}
.mflat{padding:0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 46px 58px 18px;gap:6px;
      align-items:center;padding:3px var(--sl-spacing-small);cursor:pointer;
      border-bottom:1px solid var(--sl-color-neutral-100)}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--sl-color-neutral-50)}
.mrow.flat{grid-template-columns:minmax(0,22em) 82px 46px 58px 18px;
           padding:3px var(--sl-spacing-medium)}
.mid{font-family:var(--sl-font-mono);font-size:var(--sl-font-size-x-small);
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid .nm{font-family:var(--sl-font-sans);color:var(--sl-color-neutral-500);margin-left:6px}
.mfam{font-size:var(--sl-font-size-x-small);color:var(--sl-color-neutral-500);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnum{font-family:var(--sl-font-mono);font-size:var(--sl-font-size-x-small);
      color:var(--sl-color-neutral-600);text-align:right;
      font-variant-numeric:tabular-nums;white-space:nowrap}
.cp{display:flex;color:var(--sl-color-neutral-400);opacity:0;transition:opacity .12s}
.mrow:hover .cp{opacity:1}

/* ---------- 用量柱状图（纯 CSS，不引图表库）---------- */
.chart{display:flex;align-items:flex-end;gap:2px;height:110px;
       padding:var(--sl-spacing-small) var(--sl-spacing-medium) 0}
.bar{flex:1;min-width:0;background:var(--sl-color-primary-500);
     border-radius:2px 2px 0 0;transition:background .12s}
.bar:hover{background:var(--sl-color-primary-700)}
.bar.haserr{background:var(--sl-color-danger-500)}
.axis{display:flex;gap:2px;padding:4px var(--sl-spacing-medium) var(--sl-spacing-small);
      border-bottom:1px solid var(--sl-color-neutral-200)}
.axis span{flex:1;min-width:0;text-align:center;font-size:9px;
           color:var(--sl-color-neutral-500);overflow:hidden;white-space:nowrap}
.ulegend{display:flex;gap:var(--sl-spacing-medium);flex-wrap:wrap;
         padding:var(--sl-spacing-x-small) var(--sl-spacing-medium);
         font-size:var(--sl-font-size-x-small);color:var(--sl-color-neutral-500);
         border-bottom:1px solid var(--sl-color-neutral-200)}

/* ---------- 代码片段 ---------- */
.snip{margin-bottom:var(--sl-spacing-small)}
.snip .t{display:flex;align-items:center;gap:var(--sl-spacing-x-small);
         margin-bottom:4px;font-size:var(--sl-font-size-x-small);
         color:var(--sl-color-neutral-600)}
.snip pre{margin:0;padding:var(--sl-spacing-small);overflow:auto;
          background:var(--sl-color-neutral-50);
          border:1px solid var(--sl-color-neutral-200);
          border-radius:var(--sl-border-radius-medium);
          font-family:var(--sl-font-mono);font-size:var(--sl-font-size-x-small);
          line-height:1.5}
#keybar{
  display:none;position:sticky;top:44px;z-index:19;
  margin:0;padding:var(--sl-spacing-x-small) var(--sl-spacing-medium);
  background:var(--sl-color-neutral-0);
  border-bottom:1px solid var(--sl-color-neutral-200);
  align-items:center;gap:var(--sl-spacing-x-small);
}
#keybar.on{display:flex}
#ban{display:none;margin:var(--sl-spacing-medium) var(--sl-spacing-medium) 0}
#ban.on{display:flex}
sl-tab-panel::part(base){padding:0}
sl-tab-panel{padding:var(--sl-spacing-medium)}
sl-tab-panel[active]{display:block}
.tabwrap{padding:0}
</style>
</head>
<body>

<header>
  <span class="brand">WorkBuddy 网关<span class="v" id="ver"></span></span>
  <span class="dot" id="dot"></span>
  <span class="live" id="live">连接中</span>
  <span class="spacer"></span>
  <span id="msg"></span>
  <sl-button size="small" id="btnReload">
    <sl-icon slot="prefix" name="arrow-clockwise"></sl-icon>重新检测</sl-button>
  <sl-button size="small" id="btnSelf">
    <sl-icon slot="prefix" name="play"></sl-icon>自检</sl-button>
  <sl-button size="small" variant="primary" id="btnClaim">
    <sl-icon slot="prefix" name="check-circle"></sl-icon>领取签到</sl-button>
  <sl-tooltip content="深浅色">
    <sl-icon-button id="btnTheme" name="moon" label="深浅色"></sl-icon-button>
  </sl-tooltip>
  <sl-tooltip content="API Key">
    <sl-icon-button id="btnKey" name="key" label="API Key"></sl-icon-button>
  </sl-tooltip>
  <sl-switch id="auto" checked size="small">自动</sl-switch>
</header>

<div id="keybar">
  <sl-input id="keyInput" type="password" size="small" placeholder="sk-wb-…"
            style="width:340px" password-toggle></sl-input>
  <sl-button size="small" variant="primary" id="btnSaveKey">保存</sl-button>
  <sl-button size="small" id="btnClearKey">清除</sl-button>
</div>

<sl-alert id="ban" variant="danger" open></sl-alert>

<main>
<sl-tab-group id="tabs">
  <sl-tab slot="nav" panel="overview">概览</sl-tab>
  <sl-tab slot="nav" panel="models">模型
    <sl-badge id="cMod" pill style="margin-left:6px">0</sl-badge></sl-tab>
  <sl-tab slot="nav" panel="usage">用量</sl-tab>
  <sl-tab slot="nav" panel="connect">接入</sl-tab>

  <sl-tab-panel name="overview">
    <div class="strip" id="strip"></div>
    <div class="cols">
      <div class="panel"><div class="ph">账号
          <span class="r xs muted" id="ovAccN"></span></div>
        <div id="ovAccounts"></div></div>
      <div class="panel"><div class="ph">签到
          <span class="r"><sl-button size="small" variant="primary" id="btnClaim2"
            >领取全部</sl-button></span></div>
        <div id="ovCheckin"></div></div>
    </div>
    <div class="panel" style="margin-top:var(--sl-spacing-medium)"><div class="ph">请求日志
        <span class="r"><span class="xs muted" id="logStats"></span>
        <sl-button size="small" id="btnLogRefresh">
          <sl-icon slot="prefix" name="arrow-clockwise"></sl-icon>刷新</sl-button></span></div>
      <div id="ovLogs"></div></div>
  </sl-tab-panel>

  <sl-tab-panel name="models">
    <div class="panel">
      <div class="ph">模型
        <span class="r">
          <sl-input id="modelFilter" size="small" placeholder="过滤（按 / 聚焦）"
                    clearable style="width:210px">
            <sl-icon slot="prefix" name="search"></sl-icon></sl-input>
          <sl-select id="modelSort" size="small" value="family" style="width:132px">
            <sl-option value="family">按家族</sl-option>
            <sl-option value="cost">按价格</sl-option>
            <sl-option value="ctx">按上下文</sl-option>
            <sl-option value="name">按名称</sl-option>
          </sl-select>
        </span>
      </div>
      <div class="fbar" id="modelFacets"></div>
      <div id="modelsBody"></div>
    </div>
  </sl-tab-panel>

  <sl-tab-panel name="usage">
    <div class="panel">
      <div class="ph">用量
        <span class="r">
          <sl-button-group id="usageMetric">
            <sl-button size="small" data-metric="requests" variant="primary">请求</sl-button>
            <sl-button size="small" data-metric="credits">积分</sl-button>
            <sl-button size="small" data-metric="tokens">tokens</sl-button>
          </sl-button-group>
        </span>
      </div>
      <div id="usageBody"></div>
    </div>
  </sl-tab-panel>

  <sl-tab-panel name="connect">
    <div class="cols">
      <div class="panel"><div class="ph">接入</div><div id="connectBody"></div></div>
      <div class="panel"><div class="ph">复制即用</div>
        <div style="padding:var(--sl-spacing-medium)" id="snippets"></div></div>
    </div>
  </sl-tab-panel>
</sl-tab-group>
</main>

<sl-alert id="toast" variant="success" duration="2000" toast></sl-alert>

<script>
/* 最外层护栏：脚本异常必须显式显示，绝不静默变砖 */
(function(){
  function fatal(m){
    var b=document.getElementById('ban'); if(!b) return;
    b.variant='danger'; b.classList.add('on'); b.open=true;
    b.textContent='面板脚本出错：'+m;
    var d=document.getElementById('dot'); if(d) d.className='dot off';
    var l=document.getElementById('live'); if(l) l.textContent='异常';
  }
  window.__fatal=fatal;
  window.addEventListener('error',function(e){ fatal(e.message||'未知错误'); });
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason; if(r&&r.handled) return; fatal((r&&r.message)||String(r));
  });
})();
</script>

<script>
const $ = id => document.getElementById(id);
const KEYNAME='wbgw_key', THEMENAME='wbgw_theme';
const INJECTED = (typeof window.__DSH_GATEWAY_KEY__ === 'string'
                  && window.__DSH_GATEWAY_KEY__ !== '__GATEWAY_KEY__') ? window.__DSH_GATEWAY_KEY__ : '';
const S = { key:'', timer:null, data:{} };

function readLS(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function writeLS(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function dropLS(k){ try{ localStorage.removeItem(k); }catch(e){} }

S.key = INJECTED || readLS(KEYNAME) || '';
(function(){
  try{
    const u=new URL(location.href), k=u.searchParams.get('key');
    if(k){ S.key=k; writeLS(KEYNAME,k); u.searchParams.delete('key');
           history.replaceState({},'',u.pathname+u.search+u.hash); }
  }catch(e){}
})();
$('keyInput').value = S.key;
if(!S.key) $('keybar').classList.add('on');

$('btnSaveKey').onclick=()=>{ S.key=$('keyInput').value.trim(); writeLS(KEYNAME,S.key);
  $('keybar').classList.remove('on'); loadAll(true); };
$('btnClearKey').onclick=()=>{ dropLS(KEYNAME); S.key=''; $('keyInput').value='';
  $('keybar').classList.add('on'); S.data={}; render(); };
$('btnKey').onclick=()=>$('keybar').classList.toggle('on');

/* ---------- 主题：Shoelace 用 .sl-theme-dark 类切换 ---------- */
function setTheme(t,persist){
  document.documentElement.classList.toggle('sl-theme-dark', t==='dark');
  $('btnTheme').name = t==='dark' ? 'sun' : 'moon';
  if(persist) writeLS(THEMENAME,t);
}
setTheme(document.documentElement.classList.contains('sl-theme-dark')?'dark':'light',false);
$('btnTheme').onclick=()=>setTheme(
  document.documentElement.classList.contains('sl-theme-dark')?'light':'dark',true);

/* ---------- 工具 ---------- */
function toast(m){
  const t=$('toast');
  t.innerHTML='<sl-icon slot="icon" name="check-circle"></sl-icon>'+esc(m);
  if(typeof t.toast==='function') t.toast(); else { t.open=true; }
}
function ban(m,kind){
  const b=$('ban');
  if(!m){ b.open=false; b.classList.remove('on'); return; }
  b.variant = kind==='err'?'danger' : kind==='info'?'primary' : 'warning';
  b.innerHTML='<sl-icon slot="icon" name="'
    +(kind==='err'?'x-circle':kind==='info'?'lightning-charge':'exclamation-triangle')
    +'"></sl-icon>'+esc(m);
  b.classList.add('on'); b.open=true;
}
function act(m,bad){ const e=$('msg'); e.textContent=m||'';
  e.style.color = bad ? 'var(--sl-color-danger-600)' : ''; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function copy(text,label){
  const done=()=>toast('已复制'+(label?' '+label:''));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  try{ const ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
  }catch(e){ toast('复制失败'); }
}
function fmtDur(sec){
  if(sec==null) return '—';
  sec=Math.max(0,Math.floor(sec));
  const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
  if(d) return d+'d'+h+'h'; if(h) return h+'h'+m+'m'; if(m) return m+'m';
  return sec+'s';
}
function daysLeft(iso){
  if(!iso) return null;
  const t=new Date(String(iso).replace(' ','T')).getTime();
  if(isNaN(t)) return null;
  return Math.round((t-Date.now())/86400000);
}
/* 状态一律走 sl-badge，不再自己拼 pill 样式 */
function bd(text,variant){ return `<sl-badge variant="${variant}" pill>${esc(text)}</sl-badge>`; }
function dl(d){ return d==null?'<span class="muted">—</span>'
  : d<0 ? bd('过期','danger')
  : d<=7 ? bd(d+'d','warning') : bd(d+'d','success'); }

async function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'Authorization':'Bearer '+S.key},opts.headers||{});
  let r;
  try{ r=await fetch(path,opts); }
  catch(e){ const err=new Error('无法连接'); err.status=0; throw err; }
  const text=await r.text();
  let j; try{ j=JSON.parse(text); }catch(e){ j={raw:text}; }
  if(!r.ok){
    const m=(j.error&&j.error.message)||text.slice(0,200)||('HTTP '+r.status);
    const err=new Error(m); err.status=r.status; throw err;
  }
  return j;
}

/* ---------- 加载 ---------- */
async function loadAll(loud){
  if(!S.key){
    $('dot').className='dot off'; $('live').textContent='未配置 Key';
    $('keybar').classList.add('on');
    ban('点顶栏 Key 填写，或查看 .env 的 GATEWAY_API_KEY','info');
    render(); return;
  }
  try{
    const [settings,status]=await Promise.all([api('/admin/settings'),api('/admin/status')]);
    S.data.settings=settings; S.data.status=status;
    $('dot').className='dot on';
    $('ver').textContent=' v'+settings.version;
    $('keybar').classList.remove('on');
    ban('');
    $('live').textContent=':'+settings.port;
  }catch(e){
    $('dot').className='dot off';
    if(e.status===401){
      $('live').textContent='Key 无效';
      ban('API Key 不正确，点顶栏 Key 重新填写','err');
    }else if(location.protocol==='file:'){
      $('live').textContent='打开方式不对';
      ban('请通过 http://127.0.0.1:8788/ 打开','err');
    }else{
      $('live').textContent='网关未运行';
      ban('连不上网关，试试 ./run.sh','err');
    }
    render(); return;
  }
  await Promise.allSettled([loadModels(),loadCheckin(),loadLogs(),loadUsage()]);
  render();
  if(loud) toast('已刷新');
}

function renderLive(){
  const se=S.data.settings, lg=S.data.log;
  if(!se) return;
  $('live').textContent=':'+se.port+(lg&&lg.stats?' · '+fmtDur(lg.stats.uptime_s):'');
}
async function loadModels(){
  try{ S.data.models=(await api('/admin/models')).data||[]; }catch(e){ S.data.models=[]; }
}
async function loadCheckin(){
  try{ S.data.checkin=(await api('/admin/checkin')).accounts||[]; }catch(e){ S.data.checkin=[]; }
}
async function loadLogs(loud){
  try{ S.data.log=await api('/admin/log?limit=80'); }catch(e){ S.data.log=null; }
  renderLogs(); renderLive(); if(loud) toast('已刷新');
}
async function loadUsage(){
  try{ S.data.usage=await api('/admin/usage?days=30'); }catch(e){ S.data.usage=null; }
}

/* ---------- 渲染 ---------- */
function render(){
  renderStrip(); renderAccounts(); renderModels(); renderCheckin(); renderUsage();

const NEEDKEY='<div class="empty">未配置 Key</div>';

/* /admin/settings 里 Gemini 后端的键是 name（不是 backend）——
   之前读错键，导致 Antigravity 被显示成 AI Studio。 */
function geminiName(g){
  const n=(g&&g.name)||'';
  return n==='antigravity' ? 'Antigravity' : n==='aistudio' ? 'AI Studio' : (n||'未知');
}

function renderStrip(){
  const st=S.data.status, lg=S.data.log, se=S.data.settings;
  const items=[];
  if(st){
    const av=st.accounts.filter(a=>a.available).length;
    items.push(['账号', av+'/'+st.accounts.length]);
    const cool=st.accounts.filter(a=>a.cooldown_remaining_s>0).length;
    if(cool) items.push(['冷却', cool]);
    items.push(['区域', st.catalogs.cn+'/'+st.catalogs.global]);
  }
  if(S.data.models) items.push(['模型', S.data.models.length]);
  const chk=(S.data.checkin||[]).filter(a=>a.supported&&!a.today_checked_in&&!a.error).length;
  if(chk) items.push(['签到', chk+' 可领']);
  if(lg&&lg.stats){
    items.push(['请求', lg.stats.total_requests]);
    items.push(['失败', lg.stats.total_errors]);
    items.push(['消耗', lg.stats.total_credits]);
    items.push(['运行', fmtDur(lg.stats.uptime_s)]);
  }
  if(se&&se.gemini&&se.gemini.configured){
    items.push(['Gemini', geminiName(se.gemini)]);
  }
  $('strip').innerHTML = items.length
    ? items.map(([k,v])=>`<span class="si"><i>${esc(k)}</i><b>${esc(v)}</b></span>`).join('')
    : '<span class="si"><b class="muted">等待网关</b></span>';
}

function accountRows(list){
  return list.map(a=>{
    const t=dl(daysLeft(a.expires_at)), r=dl(daysLeft(a.refresh_expires_at));
    let stt=a.available?bd('可用','success'):bd('不可用','danger');
    if(a.exhausted) stt+=' '+bd('耗尽','danger');
    if(a.cooldown_remaining_s>0) stt+=' '+bd('冷却'+a.cooldown_remaining_s+'s','warning');
    const reg=a.region==='cn'?bd('国内','neutral'):bd('国际','primary');
    return `<tr>
      <td><b>${esc(a.nickname||'—')}</b> <span class="mono muted">${esc(a.uin)}</span>
          ${a.last_error?`<div class="xs" style="color:var(--sl-color-danger-600)" title="${esc(a.last_error)}">${esc(a.last_error).slice(0,52)}</div>`:''}</td>
      <td>${reg}</td>
      <td class="num">${a.credits==null?'—':a.credits}</td>
      <td>${stt}</td>
      <td title="${esc(a.expires_at||'')}">${t}</td>
      <td title="${esc(a.refresh_expires_at||'')}">${r}</td>
      <td class="num">${a.requests_session||0}<span class="muted"> / ${a.credits_spent_session||0}</span></td>
    </tr>`;
  }).join('');
}

/* ---------- 模型：家族分组 + 分面筛选 + 排序 ---------- */
/* 分组顺序固定，不按数量排——否则目录一变顺序就跳，找不到记忆位置 */
const FAMILY_ORDER=['Gemini','Claude','DeepSeek','GLM','Kimi','MiniMax','Hunyuan','Hy','Step','Space','GPT-OSS','其他'];
function familyOf(id){
  const s=String(id).toLowerCase();
  if(s.startsWith('agy/claude')) return 'Claude';
  if(s.startsWith('agy/')) return 'GPT-OSS';
  if(s.startsWith('gemini')) return 'Gemini';
  if(s.startsWith('deepseek')) return 'DeepSeek';
  if(s.startsWith('glm')) return 'GLM';
  if(s.startsWith('kimi')) return 'Kimi';
  if(s.startsWith('minimax')) return 'MiniMax';
  if(s.startsWith('hunyuan')) return 'Hunyuan';
  if(/^hy\d/.test(s)) return 'Hy';
  if(s.startsWith('step')) return 'Step';
  if(s.startsWith('space')) return 'Space';
  return '其他';
}
function fmtCtx(n){
  if(!n) return '';
  return n>=1e6 ? (n/1e6).toFixed(n%1e6?1:0)+'M' : Math.round(n/1000)+'K';
}
function costCell(m){
  if(m.cost===0) return bd('免费','success');
  if(typeof m.cost==='number') return m.cost.toFixed(2)+'×';
  return '';              /* 上游没给就别显示占位符，少一层噪音 */
}
S.mf={q:'',facet:'all',sort:'family'};

function modelRow(m, flat){
  const nm=(m.name && String(m.name).toLowerCase()!==String(m.id).toLowerCase())
    ? `<span class="nm">${esc(m.name)}</span>` : '';
  const tip=[m.id, m.name, m.region==='cn'?'国内版':'国际版',
             m.max_tokens?'输出 '+fmtCtx(m.max_tokens):'', m.credits||'']
            .filter(Boolean).join(' · ');
  const fam = flat ? `<span class="mfam">${esc(familyOf(m.id))}</span>` : '';
  return `<div class="mrow${flat?' flat':''}" data-copy="${esc(m.id)}" data-label="模型名"`
    +` title="${esc(tip)}"><span class="mid">${esc(m.id)}${nm}</span>${fam}`
    +`<span class="mnum">${fmtCtx(m.context_window)}</span>`
    +`<span class="mnum">${costCell(m)}</span>`
    +`<span class="cp"><sl-icon name="clipboard"></sl-icon></span></div>`;
}

function renderModels(){
  const all=S.data.models;
  if(!all){ $('modelsBody').innerHTML=NEEDKEY; $('modelFacets').innerHTML=''; return; }
  const facets=[['all','全部',all.length],
                ['free','免费',all.filter(m=>m.cost===0).length],
                ['cn','国内版',all.filter(m=>m.region==='cn').length],
                ['global','Gemini/Claude',all.filter(m=>m.region==='global').length]];
  $('modelFacets').innerHTML=facets.map(([k,label,n])=>
    `<sl-button size="small" pill data-facet="${k}" `
    +`variant="${S.mf.facet===k?'primary':'default'}">${esc(label)} ${n}</sl-button>`).join('');

  const q=S.mf.q.toLowerCase();
  const list=all.filter(m=>{
    if(S.mf.facet==='free' && m.cost!==0) return false;
    if(S.mf.facet==='cn' && m.region!=='cn') return false;
    if(S.mf.facet==='global' && m.region!=='global') return false;
    if(!q) return true;
    return String(m.id).toLowerCase().includes(q)
        || String(m.name||'').toLowerCase().includes(q)
        || familyOf(m.id).toLowerCase().includes(q);
  });
  if(!list.length){ $('modelsBody').innerHTML='<div class="empty">无匹配</div>'; return; }

  if(S.mf.sort==='family'){
    const groups=new Map();
    for(const m of list){
      const k=familyOf(m.id);
      if(!groups.has(k)) groups.set(k,[]);
      groups.get(k).push(m);
    }
    const keys=[...groups.keys()].sort((a,b)=>{
      const ia=FAMILY_ORDER.indexOf(a), ib=FAMILY_ORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    });
    $('modelsBody').innerHTML='<div class="mgroups">'+keys.map(k=>{
      const items=groups.get(k).sort((a,b)=>String(a.id).localeCompare(String(b.id)));
      return `<div class="mgroup"><div class="mgh">${esc(k)}<span class="n">${items.length}</span></div>`
           + items.map(m=>modelRow(m,false)).join('')+'</div>';
    }).join('')+'</div>';
    return;
  }
  const byId=(a,b)=>String(a.id).localeCompare(String(b.id));
  const cmp = S.mf.sort==='cost'
    ? (a,b)=>((a.cost==null?1e9:a.cost)-(b.cost==null?1e9:b.cost))||byId(a,b)
    : S.mf.sort==='ctx'
    ? (a,b)=>((b.context_window||0)-(a.context_window||0))||byId(a,b)
    : byId;
  $('modelsBody').innerHTML='<div class="mflat">'
    + list.slice().sort(cmp).map(m=>modelRow(m,true)).join('')+'</div>';
}

S.um='requests';                       /* 柱状图画哪个指标 */
const UM_LABEL={requests:'请求次数',credits:'消耗积分',tokens:'tokens'};

function fmtNum(n){
  n=Number(n)||0;
  if(n>=1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return String(n);
}
function renderUsage(){
  const u=S.data.usage, box=$('usageBody');
  if(!u){ box.innerHTML=NEEDKEY; return; }
  document.querySelectorAll('#usageMetric sl-button').forEach(b=>{
    b.variant = b.dataset.metric===S.um ? 'primary' : 'default';
  });

  const t=u.totals||{}, series=u.days||[], m=S.um;
  const max=Math.max(1, ...series.map(d=>Number(d[m])||0));
  const WIN={today:'今天',d7:'近 7 天',d30:'近 30 天',all:'全部（保留期内）'};

  /* 时间窗口表：四行放一起才能横向比较，比四个大数字有用 */
  const totalsHtml='<table><tr><th>区间</th><th class="num">请求</th><th class="num">失败</th>'
    +'<th class="num">失败率</th><th class="num">积分</th><th class="num">tokens</th>'
    +'<th class="num">平均耗时</th></tr>'
    +['today','d7','d30','all'].map(k=>{
      const v=t[k]||{};
      return `<tr><td>${WIN[k]}</td>
        <td class="num">${v.requests||''}</td>
        <td class="num">${v.errors||''}</td>
        <td class="num">${v.requests&&v.errors?(v.error_rate*100).toFixed(1)+'%':''}</td>
        <td class="num">${v.credits?v.credits.toFixed(2):''}</td>
        <td class="num">${v.tokens?fmtNum(v.tokens):''}</td>
        <td class="num">${v.avg_ms?v.avg_ms+'ms':''}</td></tr>`;
    }).join('')+'</table>';

  const chart='<div class="chart">'+series.map(d=>{
      const v=Number(d[m])||0;
      const h=v ? Math.max(2, Math.round(v/max*100)) : 1;
      const tip=`${d.date} · ${d.requests} 次 · ${d.errors} 失败 · ${d.credits} 积分 · ${d.tokens} tok`;
      return `<div class="bar${d.errors?' haserr':''}" style="height:${h}%"`
           +` title="${esc(tip)}"></div>`;
    }).join('')+'</div>'
    +'<div class="axis">'+series.map((d,i)=>
      `<span>${(i%5===0||i===series.length-1)?esc(d.date.slice(5)):''}</span>`).join('')+'</div>';

  const detail=(rows,key,label)=>{
    if(!rows.length) return '';
    return `<div class="ph" style="border-top:1px solid var(--sl-color-neutral-200)">${label}</div>`
      +`<table><tr><th>${label}</th><th class="num">请求</th><th class="num">失败</th>`
      +'<th class="num">积分</th><th class="num">tokens</th>'
      +'<th class="num">平均耗时</th><th class="num">最大</th></tr>'
      +rows.map(r=>`<tr><td class="mono">${esc(r[key])}</td>
        <td class="num">${r.requests}</td>
        <td class="num">${r.errors||''}</td>
        <td class="num">${r.credits?r.credits.toFixed(2):''}</td>
        <td class="num">${r.tokens?fmtNum(r.tokens):''}</td>
        <td class="num">${r.avg_ms?r.avg_ms+'ms':''}</td>
        <td class="num">${r.max_ms?r.max_ms+'ms':''}</td></tr>`).join('')
      +'</table>';
  };

  const range=u.first_at?`${esc(u.first_at)} → ${esc(u.last_at)}`:'还没有记录';
  /* 不要显示 loaded_records —— 那是"启动时载入"的条数，和当前累计不是一回事 */
  const nRec=((t.all&&t.all.requests)||0), nTest=u.test_requests||0;
  const note='<div class="ulegend">'
    +`<span>柱状图：${UM_LABEL[m]}</span>`
    +`<span>${u.persisted?'落盘累积 · '+esc(u.path||''):'⚠ 仅内存，重启即丢'}</span>`
    +`<span>保留 ${u.retention_days} 天</span>`
    +`<span>${range}</span>`
    +`<span>共 ${nRec} 条记录</span>`
    +(nTest?`<span>另有 ${nTest} 条测试流量，未计入</span>`:'')
    +'</div>';

  box.innerHTML = totalsHtml + note + chart
    + detail(u.models||[],'model','模型')
    + detail(u.accounts||[],'account','账号');
}

async function doSelftest(){
  act('自检中…');
  try{
    const r=await api('/admin/selftest',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    act(r.ok?`自检通过 · ${r.model} @ ${r.account} · 首字 ${r.latency_ms}ms`:`自检未过：${r.error}`, !r.ok);

  try{ await api('/admin/checkin/claim',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({account_ids:[id]})});
    toast('已领取'); await loadCheckin(); await loadAll();
  }catch(e){ toast('领取失败：'+e.message); }
}

  const n=(S.data.checkin||[]).filter(a=>a.supported&&!a.today_checked_in&&!a.error).length;

        body:JSON.stringify({all:true})});

/* sl-tab-group 自己管面板切换，这里只做深链同步。
   坑：组件未升级时 show() 无效；刚升级时它的首帧又会把 active 设回第一个页签，
   所以 show() 必须带校验重试，否则 ?tab= 深链静默失效（曾经如此）。 */
function switchTab(name){
  const tg=$('tabs');
  if(!tg) return;
  let tries=0;
  const apply=()=>{
    try{ tg.show(name); }catch(e){}
    if(tg.activeTab!==name && ++tries<12) requestAnimationFrame(apply);
  };
  if(customElements.get('sl-tab-group')) apply();
  else customElements.whenDefined('sl-tab-group').then(apply);
}
$('tabs').addEventListener('sl-tab-show',e=>{
  try{
    const u=new URL(location.href), n=e.detail.name;
    if(n&&n!=='overview') u.searchParams.set('tab',n); else u.searchParams.delete('tab');
    history.replaceState({},'',u.pathname+u.search+u.hash);
  }catch(err){}
});

$('modelFacets').addEventListener('click',e=>{
  const c=e.target.closest('[data-facet]'); if(!c) return;
  S.mf.facet=c.dataset.facet; renderModels(); syncModelUrl();
});
$('usageMetric').addEventListener('click',e=>{
  const b=e.target.closest('[data-metric]'); if(!b) return;
  S.um=b.dataset.metric; renderUsage();
});
/* 「/」聚焦模型搜索 —— 命令面板的肌肉记忆 */
document.addEventListener('keydown',e=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(e.key==='/' && !/^(INPUT|TEXTAREA|SELECT|SL-INPUT|SL-SELECT)$/.test(tag)){
    e.preventDefault(); switchTab('models'); $('modelFilter').focus();
  }
});
$('btnReload').onclick=doReload;
$('btnSelf').onclick=doSelftest;
$('btnClaim').onclick=doCheckinAll;
$('btnClaim2').onclick=doCheckinAll;
$('btnLogRefresh').onclick=()=>loadLogs(true);

function setAuto(on){
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
  if(on) S.timer=setInterval(()=>{ if(S.key) loadAll(); },5000);
}
$('auto').addEventListener('sl-change',e=>setAuto(e.target.checked));

(function initModelView(){
  try{
    const u=new URL(location.href);
    const f=u.searchParams.get('facet'), s=u.searchParams.get('sort'), q=u.searchParams.get('q');
    if(f) S.mf.facet=f;
    if(s){ S.mf.sort=s; $('modelSort').value=s; }
    if(q){ S.mf.q=q; $('modelFilter').value=q; }
  }catch(e){}
})();
function syncModelUrl(){
  try{
    const u=new URL(location.href);
    const set=(k,v,d)=>{ if(v&&v!==d) u.searchParams.set(k,v); else u.searchParams.delete(k); };
    set('sort',S.mf.sort,'family'); set('facet',S.mf.facet,'all'); set('q',S.mf.q,'');
    history.replaceState({},'',u.pathname+u.search+u.hash);
  }catch(e){}
}

(function(){
  try{ const t=new URL(location.href).searchParams.get('tab'); if(t) switchTab(t); }catch(e){}
})();

loadAll();
setAuto(true);
</script>
</body>
</html>
