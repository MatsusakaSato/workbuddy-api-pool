<!--
  服务端密钥注入点。gateway/server.py 的 _dashboard() 对页面上那个**带双引号的
  占位符**做全局字面替换，把真实 key 注进来。

  两条约束：
  1. 占位符必须原样保留（含两侧双引号）—— 它就是下面 script 里的那个值；
  2. 必须是**普通 script**（非 type="module"），否则 Vite 会改写它，注入失效。

  注意：注入是全局字符串替换，所以本文件的注释里**不要**再出现那个带引号的
  占位符字面量，否则会被一并替换，key 在页面里多出几份。
-->
<script>window.__DSH_GATEWAY_KEY__ = "__GATEWAY_KEY__";</script>

<!--
  这里原本有一段「预绘制主题」脚本：在首帧之前读 localStorage / ?theme= / 系统偏好，
  决定要不要给 <html> 挂 .dark，以免刷新时闪白。面板已固定浅色、不做主题切换，
  所以整段删掉了 —— 没有主题要预绘制，也就不存在闪白。

  顺带清理：存量用户 localStorage 里可能还留着旧版的 wbgw_theme，
  它现在没有任何代码读取，留着无害（只是个孤儿键），不必专门去删。
-->
